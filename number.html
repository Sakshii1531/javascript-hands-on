<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Number</title>
    <link rel="stylesheet" href="number.css">
    

</head>
<body>
    <h1 id="number">Guess The Number</h1>

    <form>
        <input id="input" type="number" placeholder="Enter a number" max="100" min="0" required/>

        <div>
            <button id="btn">
              Check
           </button>

           <button  type = "button" id = "start-btn">
              Restart Game
           </button>
        </div>

    </form>

    <p class="result"></p>
    <p class="guess"></p>

    <script src="number.js">

    </script>
    
</body>
</html>
